name: Testes e deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  testes:
    name: Verificação de tipos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Só o typecheck, não o `next build`.
      #
      # O build de produção executa os Server Components para gerar as
      # páginas, e isso exige uma MONGODB_URI válida — que não vai (nem
      # deve) existir num runner do GitHub. O build de verdade acontece na
      # VPS, onde o .env está.
      #
      # O typecheck sozinho já pega o que mais quebra aqui: campo de banco
      # digitado errado, prop faltando, import de módulo de servidor dentro
      # de componente de cliente.
      - name: Conferir tipos
        run: npx tsc --noEmit

      # O typecheck não pega preço errado: `(overall ?? 0) * 10` tem o
      # tipo certo e o número errado. Foi exatamente assim que o site
      # passou a anunciar uma Mestra por 950 enquanto o Discord cobrava
      # 190.500, sem nada quebrar.
      #
      # Aqui roda só a varredura da fórmula antiga. A comparação com as
      # constantes do bot se pula sozinha quando o outro repositório não
      # está por perto — que é sempre, num runner do GitHub.
      - name: Conferir a fórmula de valor
        run: npm run valores:conferir

  implantar:
    name: Publicar na VPS
    needs: testes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: producao

    # Um deploy por vez, e nunca cancelar um pela metade.
    #
    # Dois pushes seguidos disparavam dois deploys simultâneos no MESMO
    # diretório da VPS, os dois fazendo `git reset --hard` e
    # `docker compose up --build` ao mesmo tempo. Aqui isso é ainda pior que
    # no bot: o `next build` leva minutos numa VPS pequena, então a janela
    # de sobreposição é grande.
    #
    # O grupo é diferente do grupo do bot de propósito: são projetos
    # separados, cada um no seu diretório, e não há motivo para o deploy de
    # um esperar o do outro.
    concurrency:
      group: deploy-vps-web
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # Sem isto, secret faltando vira um erro de SSH incompreensível lá na
      # frente. Falhar aqui, dizendo qual falta, economiza a investigação.
      - name: Conferir os secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          faltando=""
          if [ -z "$VPS_HOST" ];    then faltando="$faltando VPS_HOST"; fi
          if [ -z "$VPS_USER" ];    then faltando="$faltando VPS_USER"; fi
          if [ -z "$VPS_SSH_KEY" ]; then faltando="$faltando VPS_SSH_KEY"; fi
          if [ -z "$DEPLOY_DIR" ];  then faltando="$faltando DEPLOY_DIR"; fi

          if [ -n "$faltando" ]; then
            echo "❌ Faltam secrets:$faltando"
            echo "   Cadastre em: Settings > Secrets and variables > Actions."
            echo "   Atenção: secrets NÃO são compartilhados entre repositórios."
            exit 1
          fi
          echo "✅ Secrets presentes."

      - name: Preparar chave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          # Pela variável de ambiente, não interpolado direto no script: uma
          # chave com aspas ou barra invertida quebraria o shell se fosse
          # colada dentro do comando.
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Com o secret VPS_KNOWN_HOSTS cadastrado, confiamos só naquela
          # chave. Sem ele, o keyscan confia no que o servidor responder na
          # hora. Para fechar isso: rode `ssh-keyscan -H SEU_IP` na sua
          # máquina e salve a saída no secret VPS_KNOWN_HOSTS.
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "▶ Identidade da VPS vinda do secret VPS_KNOWN_HOSTS."
          else
            ssh-keyscan -H -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            echo "⚠️  VPS_KNOWN_HOSTS não cadastrado: confiando no keyscan."
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Rodar o deploy na VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' bash -s" < deploy/implantar.sh

      - name: Resumo
        if: always()
        run: |
          echo "Commit publicado: ${{ github.sha }}"
